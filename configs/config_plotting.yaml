# Reproducible plotting configuration for `phipml-plot`.
#
# All relative paths in this file are resolved from this YAML file. Explicit
# command-line arguments override the corresponding YAML values.
plotting:
  # One result, several explicit results, or quoted glob-style paths. You can
  # leave this empty and pass result files directly to phipml-plot.
  results: []
  # - ../results/nested_random-forest_example_420.joblib
  # - ../results/nested_random-forest_example_421.joblib

  split: auto  # auto, train, or test

  # `all` creates every plot supported by the available artifact contents.
  # Alternatively select any subset from:
  # performance, roc, pr, confusion, classification, shap-beeswarm,
  # shap-importance, shap-heatmap, feature-table.
  plots:
    - all

  # By default, every selected figure is saved in all three formats.
  formats: [pdf, svg, png]
  dpi: 600

  output_dir: ../results/plots
  output_prefix: phipml
  title: null

  # Optional display labels. When null, group_tests are recovered from the
  # model configuration embedded in current result artifacts.
  class_labels: null

  # Optional original model YAML for older artifacts without embedded context.
  config: null
  reconstruct_data: true

  # Optional explicit data sources. These override reconstructed inputs.
  features_table: null
  target_table: null
  sample_column: SampleName
  target_column: null
  library_metadata: null
  library_id_column: null

  max_display: 20
  feature_ranking: auto  # auto, top-k-frequency, or mean-abs-shap
  ranking_top_k: 30
  min_top_k_frequency: 0
  shap_alignment: strict  # strict or intersection
  validation_bootstraps: 0
  random_state: 420
  save_standalone: true

  # Matplotlib colors, colormap names, or hexadecimal colors are accepted.
  # SHAP beeswarm dots remain colored by feature value. The two class colors
  # color only the prediction-direction labels above that plot.
  class_colors: ["#4C78A8", "#E45756"]
  colors:
    roc: "#2A6F97"
    roc_band: "#89C2D9"
    pr: "#8A5A44"
    pr_band: "#DDBEA9"
    confusion_cmap: Blues
    classification: "#52796F"
    shap_cmap: viridis
    shap_heatmap_cmap: coolwarm
    shap_importance: "#6D597A"

  feature_table:
    # Supply the CSV generated by phipml-plot after manually curating display
    # annotations. Keep the Feature and numerical/statistical columns intact.
    input: null
    title: Top features by mean absolute SHAP value
    annotation_columns: [Description, Species]
    header_color: "#D9D9D9"
    row_colors: ["#F6F6F6", white]
    prevalence_cmap: YlGn
