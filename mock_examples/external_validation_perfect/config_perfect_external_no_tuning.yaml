# Perfect-signal external validation without hyperparameter tuning.

metadata_input: metadata_perfect_train_external.csv
data_input: data_perfect_train_external.csv
data_input_mode: matrix

project: mock_perfect_external
group_tests: [Control, Case]
col_sample_name: SampleName
col_target: group_test
random_state: 420

extra_features_to_include: [Sex, Smoking, Age, BMI]
peptide_prefixes: [agilent_, twist_, corona2_]
transposed: true
fillna_value: null
filters_metadata: null
combined_filters_metadata: null
oligo_filters: null
oligo_filter_mode: all

classification:
  model_type: random-forest
  seed: 420

  # No nested CV and no Bayesian search. The elastic-net selector is still
  # fitted with its fixed defaults before the Random Forest is fitted.
  run_nested_cv: false
  use_pretrained: false
  only_train_model: false

  subgroup: all
  oligo_filters: null
  oligo_filter_mode: all
  with_oligos: true
  with_additional_features: true
  prevalence_threshold_min: 0
  prevalence_threshold_max: 100

  inner_cv_splits: 2
  n_iter: 2
  n_jobs_outer: 1
  n_jobs_inner: 1

  impute_extra_numeric: false
  extra_numeric_impute_strategy: median
  fill_missing_peptides_with_zero: true

  train_filters:
    cohort: training
  split_filters: null
  split_only: false
  validation_sets:
    - name: perfect_external
      filters:
        cohort: external

  output_dir: results_perfect_external
  output_name: perfect_train

# Empty: no tuning of selector or Random Forest hyperparameters.
param_grid: {}
