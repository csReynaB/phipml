# Input tables. Relative paths are resolved from this YAML file.
# Supported data/metadata formats: CSV, TSV/TXT, XLSX, and XLS.
metadata_input: /home/creyna/Vogl-lab_Projects_git/HCC/Metadata/Classification/HCC-MUW_metadata.xlsx
data_input:  /home/creyna/Vogl-lab_Projects_git/HCC/Data/Classification/Diagnostics/Controls_HCC/Data/exist.csv
# Input interpretation:
#   auto         -> existing directory means per-sample files; file means matrix
#   matrix       -> one existing sample/peptide matrix
#   sample-files -> directory or tab-delimited manifest of one-sample tables
data_input_mode: auto

# Used only in sample-files mode. Glob patterns support filename prefixes,
# suffixes, multiple patterns, and recursive discovery (for example **/*.csv).

sample_file_patterns:
  - "*.csv"
sample_file_peptide_column: ID

# By default, each sample name is its filename stem. A regular expression can
# extract another value; use a named group such as (?P<sample>...).
sample_name_regex: null

# Required only when subgroup or oligo_filters is used.
# Supported formats also include pickle for library metadata.
lib_metadata_input: /home/creyna/Vogl-lab_Projects_git/HCC/Metadata/combined_libraries_with_lineages_important_info_nonAAseq.pkl
#Classification/aligent_twist_with_important_info_excludeSARS.pkl

project: HCC_MUW
group_tests:
  - Controls
  - HCC

col_sample_name: SampleName
col_target: group_test
col_predict: class1_proba
random_state: 420

# Clinical features are returned unchanged except common Sex/Gender values,
# which are converted to 0/1. Non-numeric categorical variables should be
# one-hot encoded in the metadata before model fitting.
extra_features_to_include:
  - Sex
  - Age

# Peptides are detected by these prefixes in the modelling pipeline.
peptide_prefixes:
  - agilent
  - corona2
  - twist

# The combined peptide matrix is commonly peptide x sample. Set false for
# sample x peptide. This setting is ignored in sample-files mode because the
# generated presence/absence matrix is always sample x peptide.
transposed: true
fillna_value: null

# Optional base metadata filters applied whenever a more specific cohort filter
# is not supplied under classification.
filters_metadata: null
combined_filters_metadata: null

# Optional default library filters. The classification section can override these.
oligo_filters: null
oligo_filter_mode: all

classification:

  # -------------------------------------------------------------------
  # Cohort selection
  # -------------------------------------------------------------------
  # Cohort filters use exact matches against columns in the metadata.
  #
  # Multiple columns are combined with AND:
  #   treatment: ICI
  #   center: MUW
  #
  # A list means OR within that column:
  #   center: [MUW, UKE]
  #
  # train_filters, split_filters, and validation_sets select independent
  # cohorts from the metadata. They are not applied sequentially.
  # Therefore, include every required condition in each filter.

  # Main training cohort
  # --------------------
  # Selects the samples used as the main training dataset.
  #
  # If omitted, the top-level filters_metadata setting is inherited.
  # If neither is configured, all eligible metadata samples are used.
  #
  # Example:
  # train_filters:
  #   cohort: training
  #   center: MUW
  train_filters: null

  # Optional cohort to divide into training and hold-out samples
  # ------------------------------------------------------------
  # Selects an additional cohort that will be randomly divided according
  # to train_size. The split is stratified by the classification target
  # whenever the selected cohort contains both target classes.
  #
  # When split_only is false:
  #   - the training portion is appended to train_filters;
  #   - the hold-out portion is appended to each validation dataset;
  #   - train_filters must also be configured.
  #
  # When split_only is true:
  #   - only the cohort selected by split_filters is used;
  #   - the training portion becomes the complete training dataset;
  #   - the hold-out portion becomes the validation dataset;
  #   - train_filters and validation_sets are ignored.
  #
  # Keep split_filters disjoint from train_filters and validation_sets
  # to prevent duplicated samples and data leakage.
  #
  # Example:
  # split_filters:
  #   cohort: cohort_to_split
  #   treatment: ICI
  split_filters: null

  # Fraction of the split_filters cohort assigned to training.
  # The remaining fraction is used as hold-out data.
  # This setting is ignored when split_filters is null.
  train_size: 0.7

  # false: combine the split cohort with the main training/validation cohorts.
  # true:  train and validate using only the split_filters cohort.
  split_only: false

  # Independent validation cohorts
  # ------------------------------
  # Each entry defines a metadata filter and the name used for output files.
  # These datasets are aligned to the features expected by the fitted model.
  #
  # Example:
  # validation_sets:
  #   - name: external_HCC
  #     filters:
  #       cohort: external
  #       center: Graz
  validation_sets: []

  # -------------------------------
  model_type: xgboost
  param_grid_name: xgboost
  seed: 420

  run_nested_cv: true
  use_pretrained: false
  only_train_model: false

  subgroup: all
  # Alternative to subgroup, including string-valued library metadata:
  # oligo_filters:
  #   Species: Homo sapiens
  oligo_filter_mode: all

  with_oligos: true
  with_additional_features: true
  prevalence_threshold_min: 1
  prevalence_threshold_max: 99

  outer_cv_splits: 5
  inner_cv_splits: 3
  n_iter: 30
  n_jobs_outer: 1
  n_jobs_inner: -1

  # Leave false when the selected estimator can handle the observed missing
  # values, and you intentionally do not want imputation.
  impute_extra_numeric: false
  extra_numeric_impute_strategy: median

  # When aligning to an external set, fill missing peptides with zero.
  fill_missing_peptides_with_zero: true

  output_dir: ../results
  output_name: Controls_vs_HCC
  input_dir: ../results
  input_name: Controls_vs_HCC

# -------------------------------------
# Bayesian search spaces are separated by model, so one Config object can
# provide either grid without mutating the YAML representation.
param_grid:
  xgboost:
    preprocessor__peptides__feature_selection__estimator__l1_ratio:
      type: real
      low: 0.2
      high: 0.8
      prior: uniform

    preprocessor__peptides__feature_selection__estimator__C:
      type: real
      low: 0.01
      high: 100.0
      prior: log-uniform

    estimator__learning_rate:
      type: real
      low: 0.01
      high: 0.3
      prior: log-uniform

    estimator__max_depth:
      type: integer
      low: 3
      high: 10

    estimator__subsample:
      type: real
      low: 0.6
      high: 1.0
      prior: uniform

    estimator__colsample_bytree:
      type: real
      low: 0.6
      high: 1.0
      prior: uniform

    estimator__reg_lambda:
      type: real
      low: 0.01
      high: 10.0
      prior: log-uniform

    estimator__n_estimators:
      type: integer
      low: 50
      high: 500

  random-forest:
    preprocessor__peptides__feature_selection__estimator__l1_ratio:
      type: real
      low: 0.2
      high: 0.8
      prior: uniform

    preprocessor__peptides__feature_selection__estimator__C:
      type: real
      low: 0.01
      high: 100.0
      prior: log-uniform

    estimator__n_estimators:
      type: integer
      low: 50
      high: 500

    estimator__max_depth:
      type: integer
      low: 3
      high: 30

    estimator__min_samples_split:
      type: integer
      low: 2
      high: 15

    estimator__min_samples_leaf:
      type: integer
      low: 1
      high: 15

    estimator__max_features:
      type: categorical
      categories: [sqrt, log2, 0.3, 0.5, 0.7]

    estimator__class_weight:
      type: categorical
      categories: [balanced, balanced_subsample]
