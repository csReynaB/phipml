# Synthetic PhIPML demonstration with perfectly predictive peptide signals.
# Relative paths are resolved from the directory containing this YAML file.

metadata_input: metadata.csv
data_input: data.csv
data_input_mode: matrix

project: mock_perfect_signal
group_tests:
  - Control
  - Case

col_sample_name: SampleName
col_target: group_test
random_state: 420

extra_features_to_include:
  - Sex
  - Smoking
  - Age
  - BMI

peptide_prefixes:
  - agilent_
  - twist_
  - corona2_

# data.csv is peptide x sample, so it is transposed during loading.
transposed: true
fillna_value: null
filters_metadata: null
combined_filters_metadata: null
oligo_filters: null
oligo_filter_mode: all

classification:
  model_type: random-forest
  seed: 420

  # Run nested CV and then fit/save one model on the complete cohort.
  run_nested_cv: true
  use_pretrained: false
  only_train_model: true

  subgroup: all
  oligo_filters: null
  oligo_filter_mode: all
  with_oligos: true
  with_additional_features: true

  # Inclusive thresholds; 0 and 100 retain every peptide in this demo.
  prevalence_threshold_min: 0
  prevalence_threshold_max: 100

  outer_cv_splits: 3
  inner_cv_splits: 2
  n_iter: 2
  n_jobs_outer: 1
  n_jobs_inner: 1

  impute_extra_numeric: false
  extra_numeric_impute_strategy: median
  fill_missing_peptides_with_zero: true

  train_filters: null
  split_filters: null
  split_only: false
  validation_sets: []

  output_dir: results
  output_name: perfect_demo

# Empty means fit without Bayesian hyperparameter tuning.
param_grid: {}
