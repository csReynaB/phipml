[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# ---------------------------------------------------------------------
# Project metadata (informational unless you pip install -e .)
# ---------------------------------------------------------------------
[project]
name = "phipml"
version = "4.2.0"
description = "Classification Machine-learning using XGBoost/random forest, and SHAP for PhIP-seq data"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]

authors = [
  { name = "Carlos S. Reyna-Blanco" }
]

# ---------------------------------------------------------------------
# Runtime dependencies
#
# Lower bounds are the versions used for the tested ML_env.yml environment.
# Upper bounds avoid silently crossing major-version compatibility boundaries.
# ML_env.yml remains the exact, reproducible environment specification.
# ---------------------------------------------------------------------
dependencies = [
  "numpy>=1.26.4,<2.0",
  "pandas>=2.2.3,<3.0",
  "scipy>=1.15.1,<2.0",
  "joblib>=1.4.2,<2.0",
  "tqdm>=4.67.1,<5.0",
  "pyyaml>=6.0.2,<7.0",
  "openpyxl>=3.1.5,<4.0",
  "xlrd>=2.0.1,<3.0",
  "scikit-learn>=1.5.2,<2.0",
  "xgboost>=2.1.3,<3.0",
  "scikit-optimize>=0.10.2,<1.0",
  "shap>=0.46.0,<1.0",
  "matplotlib>=3.10.0,<4.0",
  "seaborn>=0.12.2,<1.0",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab>=4.3.4,<5.0",
  "ipykernel>=6.29.5,<7.0",
  "tabulate>=0.9.0,<1.0",
]

dev = [
  "black",
  "isort",
  "ruff",
  "pre-commit",
  "pytest",
]
# ---------------------------------------------------------------------
# Optional dependencies (DEV ONLY)
# Install with: pip install -e .[dev]
# Or install via conda-forge separately
# ---------------------------------------------------------------------
[project.scripts]
phipml = "phipml.cli.train_test:main"
phipml-plot = "phipml.cli.plot_results:main"
phipml-heatmap = "phipml.cli.metric_heatmap:main"

# ---------------------------------------------------------------------
# Black — formatter
# ---------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py310"]

# ---------------------------------------------------------------------
# isort — import sorting (Black-compatible)
# ---------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["phipml"]
combine_as_imports = true

# ---------------------------------------------------------------------
# Ruff — linting + unused imports
# ---------------------------------------------------------------------
#[tool.ruff]
#line-length = 88
#select = ["E", "F", "I"]
#ignore = ["E501"]  # handled by Black

#[tool.ruff.per-file-ignores]
#"__init__.py" = ["F401"]          # allow re-exports
#"notebooks/*" = ["E402", "F401"]  # notebooks are messy by nature

# ---------------------------------------------------------------------
# Pytest (optional, harmless if unused)
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
