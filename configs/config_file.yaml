# Input tables. Relative paths are resolved from this YAML file.
# Supported data/metadata formats: CSV, TSV/TXT, XLSX, and XLS.
metadata_input: ../data/metadata.xlsx
data_input: ../data/exist.csv

# Input interpretation:
#   auto         -> existing directory means per-sample files; file means matrix
#   matrix       -> one existing sample/peptide matrix
#   sample-files -> directory or tab-delimited manifest of one-sample tables
data_input_mode: auto

# Used only in sample-files mode. Glob patterns support filename prefixes,
# suffixes, multiple patterns, and recursive discovery (for example **/*.csv).
sample_file_patterns:
  - "*.csv"
sample_file_peptide_column: ID

# By default, each sample name is its filename stem. A regular expression can
# extract another value; use a named group such as (?P<sample>...).
sample_name_regex: null

# Required only when subgroup or oligo_filters is used.
# Supported formats also include pickle for library metadata.
lib_metadata_input: ../data/library_metadata.pkl

project: Controls_vs_HCC
group_tests:
  - Controls
  - HCC

col_sample_name: SampleName
col_target: group_test
col_predict: class1_proba
random_state: 420

# Clinical features are returned unchanged except common Sex/Gender values,
# which are converted to 0/1. Non-numeric categorical variables should be
# one-hot encoded in the metadata before model fitting.
extra_features_to_include:
  - Sex
  - Age

# Peptides are detected by these prefixes in the modelling pipeline.
peptide_prefixes:
  - agilent
  - corona2
  - twist

# The combined peptide matrix is commonly peptide x sample. Set false for
# sample x peptide. This setting is ignored in sample-files mode because the
# generated presence/absence matrix is always sample x peptide.
transposed: true
fillna_value: null

# Optional base metadata filters applied whenever a more specific cohort filter
# is not supplied under classification.
filters_metadata: null
combined_filters_metadata: null

# Optional default library filters. The classification section can override these.
oligo_filters: null
oligo_filter_mode: all

classification:
  model_type: xgboost
  param_grid_name: xgboost
  seed: 420

  run_nested_cv: true
  use_pretrained: false
  only_train_model: false

  subgroup: all
  # Alternative to subgroup, including string-valued library metadata:
  # oligo_filters:
  #   Species: Homo sapiens
  oligo_filter_mode: all

  with_oligos: true
  with_additional_features: true
  prevalence_threshold_min: 5
  prevalence_threshold_max: 95

  outer_cv_splits: 5
  inner_cv_splits: 3
  n_iter: 30
  n_jobs_outer: 1
  n_jobs_inner: -1

  # Leave false when the selected estimator can handle the observed missing
  # values and you intentionally do not want imputation.
  impute_extra_numeric: false
  extra_numeric_impute_strategy: median
  fill_missing_peptides_with_zero: true

  # If omitted/null, top-level filters_metadata defines the training cohort.
  # train_filters:
  #   cohort: training
  train_filters: null

  # Optional special cohort to stratify into train/hold-out portions. Its
  # training part is appended to train_filters; its test part is appended to
  # each validation set. Set split_only=true to use only this split.
  split_filters: null
  train_size: 0.7
  split_only: false

  validation_sets: []
  # validation_sets:
  #   - name: external_cohort
  #     filters:
  #       cohort: external

  output_dir: ../results
  output_name: Controls_vs_HCC
  input_dir: ../results
  input_name: Controls_vs_HCC

# Bayesian search spaces are separated by model, so one Config object can
# provide either grid without mutating the YAML representation.
param_grid:
  xgboost:
    preprocessor__peptides__feature_selection__estimator__l1_ratio:
      type: real
      low: 0.2
      high: 0.8
      prior: uniform

    preprocessor__peptides__feature_selection__estimator__C:
      type: real
      low: 0.01
      high: 100.0
      prior: log-uniform

    estimator__learning_rate:
      type: real
      low: 0.01
      high: 0.3
      prior: log-uniform

    estimator__max_depth:
      type: integer
      low: 3
      high: 10

    estimator__subsample:
      type: real
      low: 0.6
      high: 1.0
      prior: uniform

    estimator__colsample_bytree:
      type: real
      low: 0.6
      high: 1.0
      prior: uniform

    estimator__reg_lambda:
      type: real
      low: 0.01
      high: 10.0
      prior: log-uniform

    estimator__n_estimators:
      type: integer
      low: 50
      high: 500

  random-forest:
    preprocessor__peptides__feature_selection__estimator__l1_ratio:
      type: real
      low: 0.2
      high: 0.8
      prior: uniform

    preprocessor__peptides__feature_selection__estimator__C:
      type: real
      low: 0.01
      high: 100.0
      prior: log-uniform

    estimator__n_estimators:
      type: integer
      low: 50
      high: 500

    estimator__max_depth:
      type: integer
      low: 3
      high: 30

    estimator__min_samples_split:
      type: integer
      low: 2
      high: 15

    estimator__min_samples_leaf:
      type: integer
      low: 1
      high: 15

    estimator__max_features:
      type: categorical
      categories: [sqrt, log2, 0.3, 0.5, 0.7]

    estimator__class_weight:
      type: categorical
      categories: [balanced, balanced_subsample]
