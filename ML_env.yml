# Direct dependencies for the phipml CLI, plotting helpers, and JupyterLab.
#
# Scientific package versions are pinned to the versions used for testing.
# Transitive dependencies and platform-specific build strings are intentionally
# left to conda-forge. For byte-for-byte reproducibility, generate a platform
# lock file from this specification with conda-lock or micromamba.
name: base
channels:
  - conda-forge
dependencies:
  # Python and package build tools
  - python=3.10.16
  - pip=25.0
  - setuptools>=77,<84
  - wheel=0.45.1

  # Data loading and numerical processing
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.15.1
  - pyyaml=6.0.2
  - joblib=1.4.2
  - tqdm=4.67.1

  # Excel input supported by phipml.io.data_handler
  - openpyxl=3.1.5
  - xlrd=2.0.1

  # Classification, feature selection, and hyperparameter optimization
  - scikit-learn=1.5.2
  - scikit-optimize=0.10.2
  - xgboost=2.1.3

  # Model interpretation
  - shap=0.46.0

  # Plotting
  - matplotlib-base=3.10.0
  - seaborn=0.12.2

  # Notebook environment. The kernel uses this same environment, so phipml
  # can be imported directly after the package is installed by the Dockerfile.
  - jupyterlab=4.3.4
  - ipykernel=6.29.5

  # Convenient for rendering DataFrames as formatted tables in notebooks.
  # This is not required by the phipml package itself.
  - tabulate=0.9.0

  # Testing
  - pytest=8.3.4
